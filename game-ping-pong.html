<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ping-Pong — Terminarz 7B</title>
<style>
    * { box-sizing: border-box; margin:0; padding:0; }
    body { background: radial-gradient(ellipse at top, #0D1B2A 0%, #050810 100%); min-height:100vh; font-family:'Segoe UI',sans-serif; overflow-x:hidden; position:relative; }
    #gwiazdy-tlo { position:fixed; inset:0; pointer-events:none; z-index:0; }
    .wrap { position:relative; z-index:1; max-width:760px; margin:0 auto; padding:20px; }

    #ladowanie-ekran { position:fixed; inset:0; background:#050810; z-index:500; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; }
    .spinner { width:44px; height:44px; border-radius:50%; border:4px solid rgba(255,255,255,0.15); border-top-color:#38BDF8; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .info-panel { display:flex; justify-content:space-between; align-items:center; background:rgba(22,36,71,0.7); border:1px solid rgba(56,189,248,0.25); border-radius:14px; padding:14px 18px; margin-bottom:18px; color:#fff; flex-wrap:wrap; gap:10px; font-size:14px; }
    .info-panel strong { color:#38BDF8; font-size:18px; }

    #plansza-kontener { background:rgba(13,27,42,0.6); border:1px solid rgba(56,189,248,0.25); border-radius:16px; padding:16px; box-shadow:0 0 40px rgba(56,189,248,0.08); }
    canvas { width:100%; display:block; border-radius:10px; background:#04070d; cursor:none; }

    .zasady { color:#94A3B8; font-size:12.5px; text-align:center; margin-top:14px; line-height:1.6; }
    .komunikat { text-align:center; color:#fff; font-size:22px; font-weight:bold; margin-top:16px; min-height:30px; }
    .komunikat.wygrana { color:#4caf50; }
    .komunikat.przegrana { color:#f44336; }
</style>
</head>
<body>
<div id="gwiazdy-tlo"></div>
<div id="ladowanie-ekran"><div class="spinner"></div><p style="margin-top:14px;">Ładowanie…</p></div>

<div class="wrap" id="glowny-widok" style="display:none;">
    <div id="pasek-gry-kontener"></div>
    <div class="info-panel">
        <div>Ty: <strong id="wynik-gracz">0</strong></div>
        <div>AI: <strong id="wynik-ai">0</strong></div>
        <div>Wygrane rundy: <strong id="licznik-wygranych">0</strong> / 2</div>
        <div>🏆 Punkty: <strong id="licznik-punktow">0</strong></div>
    </div>
    <div id="plansza-kontener"><canvas id="canvas" width="700" height="420"></canvas></div>
    <div class="komunikat" id="komunikat"></div>
    <div class="zasady">Poruszaj myszką nad planszą, żeby sterować swoją paletką. Pierwsze 5 punktów wygrywa rundę. Za każde 2 wygrane rundy dostajesz 1 punkt.</div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="gry-wspolne.js"></script>
<script>
(async function () {
    const user = await GryWspolne.start();
    if (!user) return;

    const pozostaloCzasu = await GryWspolne.pobierzPozostalyCzas();
    if (pozostaloCzasu <= 0) { GryWspolne.pokazBlokadeLimitu(); return; }

    document.getElementById('ladowanie-ekran').style.display = 'none';
    document.getElementById('glowny-widok').style.display = 'block';
    GryWspolne.renderujPasekGory('🏓 Ping-Pong', 'pasek-gry-kontener');
    GryWspolne.stworzGwiazdy(document.getElementById('gwiazdy-tlo'), 90);
    GryWspolne.aktualizujPasekCzasu(pozostaloCzasu);
    GryWspolne.uruchomZegar(() => { zatrzymanaGra = true; GryWspolne.pokazBlokadeLimitu(); });

    const postep = await GryWspolne.pobierzPostep('ping-pong');
    document.getElementById('licznik-punktow').innerText = postep.punkty;
    document.getElementById('licznik-wygranych').innerText = postep.licznik_postepu % 2;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const PALETKA_W = 12, PALETKA_H = 90;
    let zatrzymanaGra = false;

    let gracz = { y: H / 2 - PALETKA_H / 2, wynik: 0 };
    let ai = { y: H / 2 - PALETKA_H / 2, wynik: 0, predkosc: 4.4 };
    let pilka = { x: W / 2, y: H / 2, vx: 5, vy: 3, r: 8 };
    let wygraneRundy = postep.licznik_postepu % 2;

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const skala = H / rect.height;
        const y = (e.clientY - rect.top) * skala;
        gracz.y = Math.min(H - PALETKA_H, Math.max(0, y - PALETKA_H / 2));
    });

    function resetPilki(kierunek) {
        pilka.x = W / 2; pilka.y = H / 2;
        pilka.vx = 5 * kierunek;
        pilka.vy = (Math.random() * 4 - 2);
    }

    function rysuj() {
        ctx.clearRect(0, 0, W, H);
        // linia środkowa
        ctx.strokeStyle = 'rgba(56,189,248,0.25)';
        ctx.setLineDash([8, 10]);
        ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
        ctx.setLineDash([]);

        // paletki
        ctx.fillStyle = '#38BDF8';
        ctx.shadowColor = '#38BDF8'; ctx.shadowBlur = 12;
        ctx.fillRect(14, gracz.y, PALETKA_W, PALETKA_H);
        ctx.fillStyle = '#f44336';
        ctx.shadowColor = '#f44336';
        ctx.fillRect(W - 14 - PALETKA_W, ai.y, PALETKA_W, PALETKA_H);
        ctx.shadowBlur = 0;

        // piłka
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(pilka.x, pilka.y, pilka.r, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
    }

    async function zakonczRunde(wygralGracz) {
        const komunikat = document.getElementById('komunikat');
        if (wygralGracz) {
            komunikat.innerText = 'Wygrałeś rundę! 🎉';
            komunikat.className = 'komunikat wygrana';
            wygraneRundy++;
            if (wygraneRundy >= 2) {
                const nowePunkty = await GryWspolne.dodajPunkty('ping-pong', 1);
                document.getElementById('licznik-punktow').innerText = nowePunkty;
                wygraneRundy = 0;
                komunikat.innerText = 'Wygrałeś rundę! +1 punkt za 2 wygrane! 🏆';
            }
            await GryWspolne.ustawPostep('ping-pong', wygraneRundy);
            document.getElementById('licznik-wygranych').innerText = wygraneRundy;
        } else {
            komunikat.innerText = 'Przegrałeś tę rundę — spróbuj ponownie!';
            komunikat.className = 'komunikat przegrana';
        }
        gracz.wynik = 0; ai.wynik = 0;
        document.getElementById('wynik-gracz').innerText = 0;
        document.getElementById('wynik-ai').innerText = 0;
        setTimeout(() => { komunikat.innerText = ''; }, 2500);
        resetPilki(wygralGracz ? -1 : 1);
    }

    function petla() {
        if (zatrzymanaGra) return;
        pilka.x += pilka.vx;
        pilka.y += pilka.vy;

        if (pilka.y - pilka.r < 0 || pilka.y + pilka.r > H) pilka.vy *= -1;

        // kolizja z paletką gracza
        if (pilka.x - pilka.r < 14 + PALETKA_W && pilka.y > gracz.y && pilka.y < gracz.y + PALETKA_H && pilka.vx < 0) {
            pilka.vx *= -1.05;
            pilka.vy += (pilka.y - (gracz.y + PALETKA_H / 2)) * 0.08;
        }
        // kolizja z paletką AI
        if (pilka.x + pilka.r > W - 14 - PALETKA_W && pilka.y > ai.y && pilka.y < ai.y + PALETKA_H && pilka.vx > 0) {
            pilka.vx *= -1.05;
            pilka.vy += (pilka.y - (ai.y + PALETKA_H / 2)) * 0.08;
        }

        // AI - podąża za piłką z ograniczoną prędkością (żeby dało się wygrać)
        const celAi = pilka.y - PALETKA_H / 2;
        if (Math.abs(celAi - ai.y) > ai.predkosc) {
            ai.y += celAi > ai.y ? ai.predkosc : -ai.predkosc;
        }
        ai.y = Math.min(H - PALETKA_H, Math.max(0, ai.y));

        // punkt
        if (pilka.x < 0) {
            ai.wynik++;
            document.getElementById('wynik-ai').innerText = ai.wynik;
            if (ai.wynik >= 5) { zakonczRunde(false); } else { resetPilki(1); }
        } else if (pilka.x > W) {
            gracz.wynik++;
            document.getElementById('wynik-gracz').innerText = gracz.wynik;
            if (gracz.wynik >= 5) { zakonczRunde(true); } else { resetPilki(-1); }
        }

        rysuj();
        requestAnimationFrame(petla);
    }

    resetPilki(1);
    petla();

    window.addEventListener('beforeunload', () => GryWspolne.zatrzymajZegar());
})();
</script>
</body>
</html>
