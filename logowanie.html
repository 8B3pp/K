<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminarz - 6B (Logowanie)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0D1B2A;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            gap: 40px;
            flex-wrap: wrap;
        }
        .container {
            background: #162447;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 400px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .info-box {
            text-align: center;
        }
        .info-box h1 {
            color: white;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .info-box h3 {
            margin: 15px 0;
            color: #444;
        }
        .info-box p {
            margin: 10px 0;
            color: #666;
            font-size: 14px;
        }
        hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 20px 0;
        }
        .form-box h2 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border 0.3s;
        }
        .form-group input:focus {
            border-color: #007bff;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0 15px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #218838;
        }
        .register-link {
            text-align: center;
            font-size: 14px;
            color: #555;
        }
        .register-link a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .footer-note {
            margin-top: 15px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container info-box">
        <h1>Witaj z powrotem!</h1>
        <hr>
        <h3>Aby korzystać z Terminarza 6B</h3>
        <h3>Musisz się zalogować!</h3>
        <p>Jeżeli jesteś nowy i nie masz jeszcze konta, kliknij na dole pod przyciskiem link <strong>Zarejestruj się!</strong> i wypełnij odpowiednie pola.</p>
        <hr>
        <p class="footer-note">Created by Hubert B. 6B</p>
    </div>

    <div class="container form-box">
        <h2>Zaloguj się</h2>
        <hr>
        <div class="form-group">
            <label for="login-imie">Imię</label>
            <input type="text" id="login-imie" placeholder="Wpisz imię">
        </div>
        <div class="form-group">
            <label for="login-nazwisko">Nazwisko</label>
            <input type="text" id="login-nazwisko" placeholder="Wpisz nazwisko">
        </div>
        <div class="form-group">
            <label for="login-password">Hasło</label>
            <input type="password" id="login-password" placeholder="Twoje hasło">
        </div>
        <button class="btn" id="btn-logowanie">Zaloguj się</button>
        <div class="register-link">
            Nie masz konta? <a href="/K/rejestracja">Zarejestruj się</a>
        </div>
        <hr>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://uvjgmxvfzvweoxeicned.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_hGHRqdmuObIyLnpzVzZiPA_Cslp7V1G';
        let sb;
        if (typeof window.supabaseClient === 'undefined') {
            sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            window.supabaseClient = sb;
        } else {
            sb = window.supabaseClient;
        }

        function generujFakeEmail(imie, nazwisko) {
            const czysteImie = imie
                .trim()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/ł/g, "l")
                .replace(/[^a-z0-9]/g, '');
            const czysteNazwisko = nazwisko
                .trim()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/ł/g, "l")
                .replace(/[^a-z0-9]/g, '');
            return czysteImie + czysteNazwisko + '@klasa.com';
        }

        document.addEventListener("DOMContentLoaded", () => {
            const btnLogowanie = document.getElementById('btn-logowanie');
            const imieInput = document.getElementById('login-imie');
            const nazwiskoInput = document.getElementById('login-nazwisko');
            const passwordInput = document.getElementById('login-password');

            if (btnLogowanie) {
                btnLogowanie.addEventListener('click', async () => {
                    const imie = imieInput.value.trim();
                    const nazwisko = nazwiskoInput.value.trim();
                    const password = passwordInput.value;

                    if (!imie || !nazwisko || !password) {
                        alert("Wypełnij wszystkie pola!");
                        return;
                    }

                    const fakeEmail = generujFakeEmail(imie, nazwisko);
                    console.log("Próba logowania:", fakeEmail);

                    try {
                        const { error } = await sb.auth.signInWithPassword({
                            email: fakeEmail,
                            password: password
                        });

                        if (error) {
                            console.error("Błąd logowania:", error);
                            alert("Błędne imię, nazwisko lub hasło!");
                        } else {
                            window.location.href = '/K/index.html';
                        }
                    } catch (err) {
                        console.error("Wyjątek:", err);
                        alert("Wystąpił błąd połączenia. Spróbuj ponownie.");
                    }
                });
            }
        });
    </script>
</body>
</html>
