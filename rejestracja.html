<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja - Terminarz 6B</title>
</head>
<body>
    <div style="max-width: 400px; margin: 20px auto; padding: 30px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3); font-family: 'Segoe UI', sans-serif;">
        <h2 style="text-align: center; color: #333; margin-bottom: 25px; font-weight: 600;">Zarejestruj się!</h2>
        <hr>
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; color: #666; font-size: 14px;">Imię</label>
            <input type="text" id="reg-imie" placeholder="Wpisz swoje prawdziwe imię!" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; box-sizing: border-box; transition: 0.3s;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; color: #666; font-size: 14px;">Nazwisko</label>
            <input type="text" id="reg-nazwisko" placeholder="Wpisz swoje prawdziwe nazwisko!" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; box-sizing: border-box; transition: 0.3s;">
        </div>
        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 5px; color: #666; font-size: 14px;">Hasło</label>
            <input type="password" id="reg-password" placeholder="Min. 6 znaków. Dowolne." style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; box-sizing: border-box; transition: 0.3s;">
        </div>
        <button id="btn-rejestracja" style="width: 100%; padding: 14px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;">Stwórz konto!</button>
        <div style="text-align: center; margin-top: 15px; font-size: 14px; color: #666;">
            Masz już konto? <a href="/logowanie" style="color: #007bff; text-decoration: none; font-weight: bold;">Zaloguj się</a>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        // Inicjalizacja Supabase
        if (typeof window.supabaseClient === 'undefined') {
            const SUPABASE_URL = 'https://uvjgmxvfzvweoxeicned.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_hGHRqdmuObIyLnpzVzZiPA_Cslp7V1G';
            window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
        const sb = window.supabaseClient;

        function generujFakeEmail(imie, nazwisko) {
            let czysteImie = imie.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ł/g, "l").replace(/[^a-z0-9]/g, '');
            let czysteNazwisko = nazwisko.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ł/g, "l").replace(/[^a-z0-9]/g, '');
            return czysteImie + czysteNazwisko + '@klasa.com';
        }

        document.addEventListener("DOMContentLoaded", () => {
            const btnRejestracja = document.getElementById('btn-rejestracja');
            if (btnRejestracja) {
                btnRejestracja.addEventListener('click', async () => {
                    const imie = document.getElementById('reg-imie').value;
                    const nazwisko = document.getElementById('reg-nazwisko').value;
                    const password = document.getElementById('reg-password').value;
                    if (!imie || !nazwisko || !password) return alert("Wypełnij wszystkie pola!");
                    const fakeEmail = generujFakeEmail(imie, nazwisko);
                    const { data, error } = await sb.auth.signUp({ email: fakeEmail, password });
                    if (error) return alert("Błąd rejestracji: " + error.message);
                    if (data.user) {
                        await sb.from('profiles').insert([{ id: data.user.id, imie, nazwisko }]);
                        const { data: adminData } = await sb.from('profiles').select('id').eq('imie', 'Hubert').eq('nazwisko', 'Bereźnicki').single();
                        if (adminData) {
                            await sb.from('wiadomosci').insert([{
                                nadawca_id: adminData.id,
                                odbiorca_id: data.user.id,
                                temat: 'Witamy w terminarzu 6B!',
                                tresc: `Witaj! To jest automatyczna wiadomość, witamy cię w terminarzu 6B, który jest najbardziej pomocnym projektem w naszej klasie.\n\nRegulamin:\n1. Nie przeklinaj do innych w wiadomości i nie spamuj, wszystko jest zapisywane a zgłoszenie dla drugiej osoby to nie problem\n2. Nie zgłaszaj każdej osoby\n3. Regularnie sprawdzaj terminarz\n\nŻyczę miłego korzystania! (By Hubert B. 6B)`,
                                priorytet: 'zwykly'
                            }]);
                        }
                        alert("Konto założone pomyślnie!");
                        window.location.href = '/K/index.html';
                    }
                });
            }
        });
    </script>
</body>
</html>
